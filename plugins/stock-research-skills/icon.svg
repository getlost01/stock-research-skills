<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Stock Research Skills">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 1. red candle — the drawdown -->
  <g fill="#F87171">
    <rect x="136" y="248" width="10" height="150" rx="3"/>
    <rect x="102" y="282" width="78" height="86" rx="4"/>
  </g>

  <!-- 2. green candle — recovery -->
  <g fill="#34D399">
    <rect x="252" y="182" width="10" height="168" rx="3"/>
    <rect x="218" y="216" width="78" height="106" rx="4"/>
  </g>

  <!-- 3. green candle — continuation, higher -->
  <g fill="#34D399">
    <rect x="368" y="106" width="10" height="190" rx="3"/>
    <rect x="334" y="140" width="78" height="126" rx="4"/>
  </g>
</svg>
