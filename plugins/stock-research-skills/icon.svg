<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Stock Research Skills">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 1. red candle: small body, long lower wick — sold off, bought back -->
  <g fill="#F87171">
    <rect x="136" y="214" width="11" height="228" rx="3"/>
    <rect x="103" y="252" width="77" height="62" rx="3"/>
  </g>

  <!-- 2. green candle: solid recovery body, short wicks -->
  <g fill="#34D399">
    <rect x="252" y="176" width="11" height="186" rx="3"/>
    <rect x="219" y="198" width="77" height="128" rx="3"/>
  </g>

  <!-- 3. green candle: continuation, long upper wick -->
  <g fill="#34D399">
    <rect x="368" y="84" width="11" height="212" rx="3"/>
    <rect x="335" y="140" width="77" height="112" rx="3"/>
  </g>
</svg>
